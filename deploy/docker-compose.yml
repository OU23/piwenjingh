services:
  toolbox-backend:
    image: toolbox-backend:latest
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      TZ: Asia/Shanghai
      # OSS / STS：在 deploy/.env 中填写；启用 OSS 时将存储类型改为 oss。
      TOOLBOX_STORAGE_TYPE: "${TOOLBOX_STORAGE_TYPE:-local}"
      OSS_ENDPOINT: "${OSS_ENDPOINT:-}"
      OSS_BUCKET: "${OSS_BUCKET:-}"
      OSS_ACCESS_KEY_ID: "${OSS_ACCESS_KEY_ID:-}"
      OSS_ACCESS_KEY_SECRET: "${OSS_ACCESS_KEY_SECRET:-}"
      OSS_URL_TTL_SECONDS: "${OSS_URL_TTL_SECONDS:-3600}"
      OSS_STS_ROLE_ARN: "${OSS_STS_ROLE_ARN:-}"
      OSS_STS_DURATION_SECONDS: "${OSS_STS_DURATION_SECONDS:-3600}"
      OSS_STS_ENDPOINT: "${OSS_STS_ENDPOINT:-sts.aliyuncs.com}"
      # 数据库连接从 deploy/.env 读取；必填项缺失时 Compose 会报错。
      SPRING_DATASOURCE_URL: "${SPRING_DATASOURCE_URL:?请在 deploy/.env 中填写 SPRING_DATASOURCE_URL}"
      SPRING_DATASOURCE_USERNAME: "${SPRING_DATASOURCE_USERNAME:?请在 deploy/.env 中填写 SPRING_DATASOURCE_USERNAME}"
      SPRING_DATASOURCE_PASSWORD: "${SPRING_DATASOURCE_PASSWORD:?请在 deploy/.env 中填写 SPRING_DATASOURCE_PASSWORD}"
      TOOLBOX_JWT_SECRET: "3f101b3c4f58e3f77e385904e7e7cfb3116976be955079a03c2087f7aaef6924"
    volumes:
      - /opt/toolbox/uploads/files:/data/files
      - /opt/toolbox/uploads/chunks:/data/chunks
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/api/system/init-status || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
