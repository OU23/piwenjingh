services:
  toolbox-backend:
    image: toolbox-backend:latest
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      TZ: Asia/Shanghai
      # Replace every REPLACE_* value before the first production deployment.
      SPRING_DATASOURCE_URL: "jdbc:mysql://host.docker.internal:3306/toolbox?useUnicode=true&characterEncoding=UTF-8&connectionTimeZone=Asia/Shanghai"
      SPRING_DATASOURCE_USERNAME: "zj_toolbox"
      SPRING_DATASOURCE_PASSWORD: "aLt%8@E!9J"
      TOOLBOX_JWT_SECRET: "3f101b3c4f58e3f77e385904e7e7cfb3116976be955079a03c2087f7aaef6924"
    volumes:
      - /opt/toolbox/uploads/files:/data/files
      - /opt/toolbox/uploads/chunks:/data/chunks
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/api/system/init-status || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
