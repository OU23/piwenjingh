services:
  toolbox-backend:
    image: toolbox-backend:latest
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      TZ: Asia/Shanghai
      # Replace every REPLACE_* value before the first production deployment.
      SPRING_DATASOURCE_URL: "jdbc:mysql://REPLACE_DB_HOST:3306/REPLACE_DB_NAME?useUnicode=true&characterEncoding=UTF-8&connectionTimeZone=Asia/Shanghai"
      SPRING_DATASOURCE_USERNAME: "REPLACE_DB_USERNAME"
      SPRING_DATASOURCE_PASSWORD: "REPLACE_DB_PASSWORD"
      TOOLBOX_JWT_SECRET: "REPLACE_WITH_A_RANDOM_SECRET_AT_LEAST_32_CHARACTERS"
    volumes:
      - /opt/toolbox/uploads/files:/data/files
      - /opt/toolbox/uploads/chunks:/data/chunks
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/api/system/init-status || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
